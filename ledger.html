<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LedgerLine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f4ee;--fg:#17211f;--card:#fffdf9;--pri:#285347;--pri-fg:#fffdf9;--mut:#68736f;--sec:#ebe5da;--line:#e1dacf;--gold:#b68b45;--gold-s:#e8d7b6;--profit:#2e7755;--loss:#a55e5a;--side:#132b35;--shadow:0 1px 2px rgba(23,33,31,.05),0 14px 40px -16px rgba(23,33,31,.18);--serif:'Playfair Display',Georgia,serif;--sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif}
:root[data-theme=dark]{--bg:#132127;--fg:#f4efe6;--card:#1b2d33;--pri:#d5b36d;--pri-fg:#132127;--mut:#9aa9a6;--sec:#243a41;--line:#2b434b;--profit:#8fc5a5;--loss:#e0928d;--side:#0d1a20;--shadow:0 1px 2px rgba(0,0,0,.4),0 14px 40px -16px rgba(0,0,0,.6)}
*{box-sizing:border-box;margin:0}
body{font-family:var(--sans);background:var(--bg);color:var(--fg);display:flex;min-height:100vh;-webkit-font-smoothing:antialiased;transition:background .4s,color .4s}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.side{width:236px;flex:none;background:var(--side);color:#f8f4eb;padding:26px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{font-family:var(--serif);font-size:1.5rem;font-weight:600;padding:0 12px 22px;letter-spacing:-.02em}
.brand i{font-style:normal;color:var(--gold)}
.nav{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;border:0;background:none;color:rgba(248,244,235,.7);text-align:left;font-size:.92rem;font-weight:500;transition:background .2s,color .2s}
.nav:hover{background:rgba(255,255,255,.07);color:#fff}
.nav[aria-current=page]{background:rgba(255,255,255,.12);color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
.nav svg{width:18px;height:18px;flex:none}
.sp{flex:1}
.main{flex:1;min-width:0;padding:36px clamp(18px,4vw,48px) 60px;max-width:1180px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.top p{color:var(--mut);font-size:.88rem;margin-bottom:6px}
h1{font-family:var(--serif);font-size:2.1rem;font-weight:600;letter-spacing:-.03em}
.acts{display:flex;gap:8px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 16px;font-size:.88rem;font-weight:600;transition:transform .15s,filter .2s}
.btn:hover{filter:brightness(.97)}.btn:active{transform:scale(.96)}
.btn.p{background:var(--pri);color:var(--pri-fg);border-color:var(--pri)}
.icon{width:40px;padding:0;display:grid;place-items:center}
.view{animation:in .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.grid{display:grid;gap:18px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:18px}
.two{grid-template-columns:3fr 2fr}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:22px;border:1px solid var(--line);min-width:0}
.card h3{font-family:var(--serif);font-size:1.15rem;font-weight:600;margin-bottom:16px}
.lab{font-size:.8rem;color:var(--mut);font-weight:500}
.num{font-family:var(--serif);font-size:1.7rem;font-weight:600;margin-top:8px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi.hero{background:var(--pri);color:var(--pri-fg)}.kpi.hero .lab{color:inherit;opacity:.75}
.pos{color:var(--profit)}.neg{color:var(--loss)}
.chart{width:100%;height:220px}
.chart .b{transform-origin:bottom;transform-box:fill-box;animation:grow .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleY(0)}}
.chart text{fill:var(--mut);font-size:11px}
.legend{display:flex;gap:16px;font-size:.8rem;color:var(--mut);margin-bottom:6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px}
.donut{width:150px;height:150px;border-radius:50%;margin:0 auto 18px;position:relative;transition:background .6s}
.donut::after{content:"";position:absolute;inset:26px;background:var(--card);border-radius:50%}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:.88rem}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.row b{margin-left:auto;font-variant-numeric:tabular-nums}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.tools input,.tools select,dialog input,dialog select{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none;transition:border-color .2s,box-shadow .2s}
.tools input{flex:1;min-width:180px}
input:focus,select:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-s)}
:root[data-theme=dark] input:focus,:root[data-theme=dark] select:focus{box-shadow:0 0 0 3px rgba(213,179,109,.25)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem;min-width:640px}
th{text-align:left;font-size:.76rem;color:var(--mut);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:13px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{animation:in .4s both;transition:background .2s}tbody tr:hover{background:var(--sec)}
td.a,th.a{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.who{display:flex;align-items:center;gap:12px}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:.72rem;font-weight:700;color:#fff;flex:none}
.sub{font-size:.78rem;color:var(--mut)}
.tag{font-size:.74rem;padding:3px 9px;border-radius:99px;background:var(--sec);white-space:nowrap}
.tag.pend{background:var(--gold-s);color:#5d4728}
.mini{border:0;background:none;color:var(--mut);padding:6px;border-radius:8px;opacity:.5;transition:opacity .2s,color .2s}
tr:hover .mini{opacity:1}.mini:hover{color:var(--loss)}
.bar{height:8px;border-radius:8px;background:var(--sec);overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;border-radius:8px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.bud{margin-bottom:22px}
.bud .h{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.9rem;font-weight:600}
.bud input{width:130px;text-align:right;padding:6px 10px}
.line{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line);font-size:.92rem;font-variant-numeric:tabular-nums}
.line.s{font-weight:700;font-size:1rem;border-bottom:2px solid var(--fg)}
.empty{text-align:center;padding:40px;color:var(--mut)}
dialog{border:0;border-radius:18px;padding:26px;width:min(460px,92vw);background:var(--card);color:var(--fg);box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(10,20,24,.55);backdrop-filter:blur(3px)}
dialog[open]{animation:pop .3s cubic-bezier(.2,1.2,.4,1)}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(10px)}}
dialog h2{font-family:var(--serif);margin-bottom:18px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f label{display:grid;gap:5px;font-size:.78rem;color:var(--mut);font-weight:500}
.f .w{grid-column:1/-1}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sec);border-radius:10px;padding:4px}
.seg button{border:0;background:none;border-radius:7px;padding:9px;font-weight:600;font-size:.88rem;color:var(--mut);transition:background .2s,color .2s}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,30px);background:var(--side);color:#fff;padding:12px 20px;border-radius:12px;font-size:.88rem;opacity:0;transition:.35s;pointer-events:none;z-index:9}
.toast.on{opacity:1;transform:translate(-50%,0)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media(max-width:860px){body{flex-direction:column}.side{width:100%;height:auto;position:static;flex-direction:row;overflow-x:auto;padding:12px;align-items:center}.brand{padding:0 12px 0 4px}.nav span{display:none}.sp{display:none}.two{grid-template-columns:1fr}h1{font-size:1.7rem}}
@media print{.side,.acts,.tools{display:none}body{display:block}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<aside class="side" id="side"></aside>
<main class="main">
  <div class="top">
    <div><p id="eyebrow"></p><h1 id="title"></h1></div>
    <div class="acts">
      <button class="btn icon" id="theme" aria-label="Switch theme">◐</button>
      <button class="btn" id="csv">Export CSV</button>
      <button class="btn p" id="add">Add transaction</button>
    </div>
  </div>
  <div id="view" class="view"></div>
</main>

<dialog id="dlg">
  <form method="dialog" id="form">
    <h2 id="dt">New transaction</h2>
    <div class="f">
      <div class="w seg" id="seg"><button type="button" data-k="income" class="on">Money in</button><button type="button" data-k="expense">Money out</button></div>
      <label class="w">Description<input id="fd" required maxlength="80" placeholder="e.g. Counter sales"></label>
      <label>Amount (TZS)<input id="fa" type="number" min="1" step="1" required></label>
      <label>Date<input id="fdt" type="date" required></label>
      <label>Category<select id="fc"></select></label>
      <label>Account<select id="fac"></select></label>
      <label>Customer or supplier<input id="fp" maxlength="60"></label>
      <label>Status<select id="fs"><option>Cleared</option><option>Pending</option></select></label>
    </div>
    <div class="acts" style="justify-content:flex-end;margin-top:22px">
      <button type="button" class="btn" id="cancel">Cancel</button>
      <button class="btn p" type="submit">Save transaction</button>
    </div>
  </form>
</dialog>
<div class="toast" id="toast"></div>

<script>
(()=>{
const $=s=>document.querySelector(s);
const CAT={'Stock / Inventory':'#b68b45','Transport':'#6e8f84','Salaries':'#8e6a82','Utilities':'#6d7e9a','Marketing':'#a97c64','Taxes':'#a55e5a','Supplies':'#7e8c70','Rent':'#7c6c58','Other':'#b9b09f','Retail sales':'#2e7755','Wholesale':'#285347','Other income':'#5c9a7d'};
const IN=['Retail sales','Wholesale','Other income'],OUT=Object.keys(CAT).filter(c=>!IN.includes(c));
const ACCTS=['M-Pesa Till','Airtel Money','NMB Business','Cash on hand'];
const BALS={'M-Pesa Till':1840000,'Airtel Money':620000,'NMB Business':1980000,'Cash on hand':420000};
const HIST={'2026-04':[6.2,3.9],'2026-05':[7.1,4.3],'2026-06':[6.8,4.1],'2026-07':[8.4,4.9],'2026-09':[8.8,5.1]};
const BUD={'Stock / Inventory':2400000,'Transport':850000,'Utilities':650000,'Salaries':1400000};
const D=[['1058','income','2026-10-30','Wholesale order · INV-207','Wholesale','Kijitonyama Office',1380000,'NMB Business','Cleared'],['1057','expense','2026-10-30','Month-end stock restock','Stock / Inventory','Mlimani Wholesale',820000,'NMB Business','Cleared'],['1056','income','2026-10-29','Counter sales · weekend','Retail sales','Walk-in customers',920000,'M-Pesa Till','Cleared'],['1055','expense','2026-10-29','September payroll','Salaries','Team payroll',1248000,'NMB Business','Cleared'],['1054','income','2026-10-26','Invoice #INV-204 paid','Wholesale','Maua Café',820000,'NMB Business','Cleared'],['1053','expense','2026-10-25','Delivery runs · Kinondoni','Transport','Juma Logistics',728000,'Cash on hand','Cleared'],['1052','income','2026-10-22','Retail sales · M-Pesa','Retail sales','Walk-in customers',1860000,'M-Pesa Till','Cleared'],['1051','expense','2026-10-20','TANESCO and water bills','Utilities','TANESCO',572000,'NMB Business','Cleared'],['1050','income','2026-10-15','Retail sales · market week','Retail sales','Walk-in customers',2140000,'M-Pesa Till','Cleared'],['1049','expense','2026-10-12','Store supplies and packaging','Other','Mlimani Supplies',676000,'Cash on hand','Pending'],['1048','income','2026-10-08','Counter sale · 14 items','Retail sales','Walk-in customers',2280000,'M-Pesa Till','Cleared'],['1047','expense','2026-10-05','Inventory delivery and restock','Stock / Inventory','Mlimani Wholesale',1156000,'NMB Business','Cleared']]
.map(r=>({id:'TX-'+r[0],kind:r[1],date:r[2],desc:r[3],cat:r[4],party:r[5],amt:r[6],acct:r[7],status:r[8]}));

const net=t=>t.kind==='income'?t.amt:-t.amt;
const demoNet={};D.forEach(t=>demoNet[t.acct]=(demoNet[t.acct]||0)+net(t));
const OPEN={};ACCTS.forEach(a=>OPEN[a]=BALS[a]-(demoNet[a]||0));

let S={tx:D,bud:BUD,theme:null};
try{const s=JSON.parse(localStorage.getItem('ledgerline.v1'));if(s&&s.tx)S=s}catch{}
const save=()=>{try{localStorage.setItem('ledgerline.v1',JSON.stringify(S))}catch{}};
const root=document.documentElement;
S.theme=S.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
root.dataset.theme=S.theme;

const T=n=>(n<0?'−':'')+'TZS '+Math.abs(Math.round(n)).toLocaleString('en-US');
const M=n=>Math.abs(n)>=1e6?'TZS '+(n/1e6).toFixed(1)+'m':T(n);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fd=d=>{const x=new Date(d+'T00:00');return x.toLocaleDateString('en-GB',{day:'2-digit',month:'short'})};
const sum=l=>{const income=l.filter(t=>t.kind==='income').reduce((a,t)=>a+t.amt,0),exp=l.filter(t=>t.kind==='expense').reduce((a,t)=>a+t.amt,0);return{income,exp,profit:income-exp,margin:income?(income-exp)/income*100:0}};
const sorted=()=>[...S.tx].sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
const curMonth=()=>sorted().length?sorted()[0].date.slice(0,7):new Date().toISOString().slice(0,7);
const inMonth=m=>S.tx.filter(t=>t.date.startsWith(m));
const ini=n=>(n||'?').split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();

const IC={dash:'<path d="M3 12 12 4l9 8M5 10v10h5v-6h4v6h5V10"/>',led:'<path d="M5 3h14v18H5zM9 8h6M9 12h6M9 16h4"/>',acc:'<path d="M3 7h18v12H3zM3 7l3-3h12l3 3M16 13h2"/>',rep:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',bud:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'};
const PAGES=[['overview','Overview','dash','Your business at a glance'],['ledger','Ledger','led','Every shilling, in order'],['accounts','Accounts','acc','Cash, bank and mobile money'],['reports','Reports','rep','Profit, loss and VAT'],['budgets','Budgets','bud','Keep every cost funded']];
let page='overview',kind='income',editing=null,q='',fk='all',fc='all';

function shell(){
  $('#side').innerHTML='<div class="brand">Ledger<i>Line</i></div>'+PAGES.map(p=>`<button class="nav" data-p="${p[0]}" ${p[0]===page?'aria-current="page"':''}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[p[2]]}</svg><span>${p[1]}</span></button>`).join('')+'<div class="sp"></div>';
}
function go(p){page=p;location.hash=p;draw()}
$('#side').addEventListener('click',e=>{const b=e.target.closest('.nav');if(b)go(b.dataset.p)});

function draw(){
  shell();
  const meta=PAGES.find(p=>p[0]===page);
  $('#eyebrow').textContent=page==='overview'?new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'}):meta[3];
  $('#title').textContent=page==='overview'?'Overview':meta[1];
  const v=$('#view');v.style.animation='none';v.offsetHeight;v.style.animation='';
  v.innerHTML=({overview,ledger,accounts,reports,budgets})[page]();
  if(page==='ledger')bindLedger();
  if(page==='budgets')v.querySelectorAll('[data-b]').forEach(i=>i.onchange=()=>{S.bud[i.dataset.b]=Math.max(0,+i.value||0);save();draw()});
}

function overview(){
  const m=curMonth(),mt=inMonth(m),s=sum(mt);
  const total=ACCTS.reduce((a,x)=>a+bal(x),0);
  const months={};Object.entries(HIST).forEach(([k,[i,e]])=>months[k]=[i*1e6,e*1e6]);
  const live={};S.tx.forEach(t=>{const k=t.date.slice(0,7);(live[k]=live[k]||[0,0])[t.kind==='income'?0:1]+=t.amt});
  Object.entries(live).forEach(([k,[i,e]])=>months[k]=[(HIST[k]?HIST[k][0]*1e6:0)*0+i,(HIST[k]?HIST[k][1]*1e6:0)*0+e]);
  const keys=Object.keys(months).sort().slice(-6),max=Math.max(1,...keys.map(k=>Math.max(...months[k])));
  const W=560,H=200,bw=Math.min(26,300/keys.length),gap=W/keys.length;
  const bars=keys.map((k,i)=>{const x=gap*i+gap/2,[a,b]=months[k],ha=a/max*(H-30),hb=b/max*(H-30);
    return`<rect class="b" style="animation-delay:${i*70}ms" x="${x-bw-2}" y="${H-ha}" width="${bw}" height="${ha}" rx="4" fill="var(--pri)"/><rect class="b" style="animation-delay:${i*70+40}ms" x="${x+2}" y="${H-hb}" width="${bw}" height="${hb}" rx="4" fill="var(--gold)"/><text x="${x}" y="${H+16}" text-anchor="middle">${new Date(k+'-01').toLocaleDateString('en-GB',{month:'short'})}</text>`}).join('');
  const mix={};mt.filter(t=>t.kind==='expense').forEach(t=>mix[t.cat]=(mix[t.cat]||0)+t.amt);
  const mixL=Object.entries(mix).sort((a,b)=>b[1]-a[1]);let acc=0;
  const grad=mixL.length?'conic-gradient('+mixL.map(([c,v])=>{const a=acc/s.exp*100;acc+=v;return`${CAT[c]||'#999'} ${a}% ${acc/s.exp*100}%`}).join(',')+')':'var(--sec)';
  const recent=sorted().slice(0,5).map(t=>`<div class="row"><div class="av" style="background:${CAT[t.cat]||'#999'}">${ini(t.party)}</div><div><div style="font-weight:600">${esc(t.desc)}</div><div class="sub">${fd(t.date)} · ${esc(t.acct)}</div></div><b class="${t.kind==='income'?'pos':'neg'}" style="margin-left:auto">${t.kind==='income'?'+':'−'}${M(t.amt).replace('TZS ','')}</b></div>`).join('');
  return`<div class="grid kpis">
  <div class="card kpi hero"><div class="lab">Net profit · ${new Date(m+'-01').toLocaleDateString('en-GB',{month:'long'})}</div><div class="num">${M(s.profit)}</div><div class="lab" style="margin-top:6px">${s.margin.toFixed(0)}% margin</div></div>
  <div class="card kpi"><div class="lab">Money in</div><div class="num pos">${M(s.income)}</div></div>
  <div class="card kpi"><div class="lab">Money out</div><div class="num neg">${M(s.exp)}</div></div>
  <div class="card kpi"><div class="lab">Total across accounts</div><div class="num">${M(total)}</div></div></div>
  <div class="grid two"><div class="card"><h3>Income and expenses</h3><div class="legend"><span><i style="background:var(--pri)"></i>Income</span><span><i style="background:var(--gold)"></i>Expenses</span></div><svg class="chart" viewBox="0 0 ${W} ${H+24}" preserveAspectRatio="xMidYMid meet">${bars}</svg></div>
  <div class="card"><h3>Where money goes</h3><div class="donut" style="background:${grad}"></div>${mixL.map(([c,v])=>`<div class="row"><span class="dot" style="background:${CAT[c]||'#999'}"></span>${esc(c)}<b>${Math.round(v/s.exp*100)}%</b></div>`).join('')||'<div class="empty">No expenses this month.</div>'}</div></div>
  <div class="card" style="margin-top:18px"><h3>Latest activity</h3>${recent||'<div class="empty">No transactions yet.</div>'}</div>`;
}

function ledger(){
  return`<div class="tools"><input id="q" placeholder="Search description or name" value="${esc(q)}" aria-label="Search"><select id="fk" aria-label="Type"><option value="all">All types</option><option value="income"${fk==='income'?' selected':''}>Money in</option><option value="expense"${fk==='expense'?' selected':''}>Money out</option></select><select id="fcat" aria-label="Category"><option value="all">All categories</option>${Object.keys(CAT).map(c=>`<option${fc===c?' selected':''}>${esc(c)}</option>`).join('')}</select></div><div class="card" style="padding:8px"><div class="tw"><table><thead><tr><th>Date</th><th>Description</th><th>Category</th><th>Account</th><th class="a">Amount</th><th></th></tr></thead><tbody id="tb"></tbody></table></div></div>`;
}
function rows(){
  const l=sorted().filter(t=>(fk==='all'||t.kind===fk)&&(fc==='all'||t.cat===fc)&&(!q||(t.desc+t.party).toLowerCase().includes(q.toLowerCase())));
  $('#tb').innerHTML=l.length?l.map((t,i)=>`<tr style="animation-delay:${Math.min(i,12)*25}ms"><td>${fd(t.date)}</td><td><div class="who"><div class="av" style="background:${CAT[t.cat]||'#999'}">${ini(t.party)}</div><div><div style="font-weight:600">${esc(t.desc)}</div><div class="sub">${esc(t.party||'—')}${t.status==='Pending'?' · <span class="tag pend">Pending</span>':''}</div></div></div></td><td><span class="tag">${esc(t.cat)}</span></td><td>${esc(t.acct)}</td><td class="a ${t.kind==='income'?'pos':'neg'}">${t.kind==='income'?'+':'−'}${T(t.amt).replace('TZS ','')}</td><td style="white-space:nowrap"><button class="mini" data-e="${t.id}" aria-label="Edit">✎</button><button class="mini" data-d="${t.id}" aria-label="Delete">✕</button></td></tr>`).join(''):'<tr><td colspan="6" class="empty">No transactions match. Add one to start your ledger.</td></tr>';
}
function bindLedger(){
  rows();
  $('#q').oninput=e=>{q=e.target.value;rows()};
  $('#fk').onchange=e=>{fk=e.target.value;rows()};
  $('#fcat').onchange=e=>{fc=e.target.value;rows()};
  $('#tb').onclick=e=>{
    const ed=e.target.closest('[data-e]'),de=e.target.closest('[data-d]');
    if(ed)openForm(S.tx.find(t=>t.id===ed.dataset.e));
    if(de&&confirm('Delete this transaction?')){S.tx=S.tx.filter(t=>t.id!==de.dataset.d);save();rows();toast('Transaction deleted')}
  };
}

const bal=a=>OPEN[a]+S.tx.filter(t=>t.acct===a).reduce((s,t)=>s+net(t),0);
function accounts(){
  const type={'M-Pesa Till':'Mobile money','Airtel Money':'Mobile money','NMB Business':'Bank account','Cash on hand':'Cash'};
  return`<div class="grid kpis">${ACCTS.map(a=>`<div class="card kpi"><div class="lab">${type[a]}</div><div style="font-weight:600;margin-top:4px">${a}</div><div class="num ${bal(a)<0?'neg':''}">${T(bal(a))}</div></div>`).join('')}</div><div class="card"><div class="line s"><span>Total across accounts</span><span>${T(ACCTS.reduce((s,a)=>s+bal(a),0))}</span></div><p class="sub" style="margin-top:14px">Balances start from your opening position and move with every transaction you add, edit or delete.</p></div>`;
}

function reports(){
  const m=curMonth(),mt=inMonth(m),s=sum(mt),cogs=mt.filter(t=>t.kind==='expense'&&t.cat==='Stock / Inventory').reduce((a,t)=>a+t.amt,0),gp=s.income-cogs,opx=s.exp-cogs;
  const vc=Math.round(s.income*.18),vp=Math.round(s.exp*.18);
  const L=(a,b,c)=>`<div class="line ${c||''}"><span>${a}</span><span>${b}</span></div>`;
  const label=new Date(m+'-01').toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  return`<div class="grid two" style="grid-template-columns:1fr 1fr"><div class="card"><h3>Profit and loss · ${label}</h3>${L('Income',T(s.income))}${L('Cost of goods (inventory)','−'+T(cogs).replace('−',''))}${L('Gross profit',T(gp),'s')}${L('Operating expenses','−'+T(opx).replace('−',''))}${L('Net profit',`<span class="${s.profit>=0?'pos':'neg'}">${T(s.profit)}</span>`,'s')}${L('Net margin',s.margin.toFixed(1)+'%')}</div>
  <div class="card"><h3>VAT estimate · 18%</h3>${L('VAT collected on sales',T(vc))}${L('VAT paid on purchases',T(vp))}${L('VAT owed',T(vc-vp),'s')}<p class="sub" style="margin-top:14px">An estimate that treats every sale and purchase as taxable. Confirm with your accountant before filing.</p><button class="btn" style="margin-top:16px" onclick="print()">Print report</button></div></div>`;
}

function budgets(){
  const m=curMonth(),mt=inMonth(m).filter(t=>t.kind==='expense');
  return`<div class="card" style="max-width:720px"><h3>Monthly limits · ${new Date(m+'-01').toLocaleDateString('en-GB',{month:'long'})}</h3>${Object.keys(S.bud).map(c=>{const sp=mt.filter(t=>t.cat===c).reduce((a,t)=>a+t.amt,0),b=S.bud[c],p=b?sp/b*100:0,col=p>100?'var(--loss)':p>85?'var(--gold)':'var(--profit)';
    return`<div class="bud"><div class="h"><span>${esc(c)}</span><input type="number" min="0" data-b="${esc(c)}" value="${b}" aria-label="Limit for ${esc(c)}"></div><div class="bar"><i style="width:${Math.min(100,p)}%;background:${col}"></i></div><div class="sub">${T(sp)} spent · ${p>100?`<span class="neg">${T(sp-b)} over</span>`:`${T(b-sp)} left`}</div></div>`}).join('')}</div>`;
}

// Form
const dlg=$('#dlg');
function fill(){const cats=kind==='income'?IN:OUT;$('#fc').innerHTML=cats.map(c=>`<option>${esc(c)}</option>`).join('')}
function openForm(t){
  editing=t||null;kind=t?t.kind:'income';fill();
  $('#dt').textContent=t?'Edit transaction':'New transaction';
  $('#fac').innerHTML=ACCTS.map(a=>`<option>${a}</option>`).join('');
  $('#fd').value=t?t.desc:'';$('#fa').value=t?t.amt:'';$('#fdt').value=t?t.date:new Date().toISOString().slice(0,10);
  $('#fc').value=t?t.cat:$('#fc').options[0].value;$('#fac').value=t?t.acct:ACCTS[0];$('#fp').value=t?t.party:'';$('#fs').value=t?t.status:'Cleared';
  document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.k===kind));
  dlg.showModal();$('#fd').focus();
}
$('#seg').onclick=e=>{const b=e.target.closest('button');if(!b)return;kind=b.dataset.k;document.querySelectorAll('#seg button').forEach(x=>x.classList.toggle('on',x===b));fill()};
$('#add').onclick=()=>openForm();
$('#cancel').onclick=()=>dlg.close();
$('#form').addEventListener('submit',()=>{
  const o={kind,desc:$('#fd').value.trim(),amt:Math.round(+$('#fa').value),date:$('#fdt').value,cat:$('#fc').value,acct:$('#fac').value,party:$('#fp').value.trim(),status:$('#fs').value};
  if(!o.desc||!o.amt||!o.date)return;
  if(editing)Object.assign(editing,o);else S.tx.push({id:'TX-'+(1100+S.tx.length+Math.floor(Math.random()*900)),...o});
  save();toast(editing?'Transaction updated':'Transaction saved');draw();
});

$('#theme').onclick=()=>{S.theme=S.theme==='dark'?'light':'dark';root.dataset.theme=S.theme;save()};
$('#csv').onclick=()=>{
  const h=['ID','Date','Type','Description','Category','Name','Account','Status','Amount (TZS)'];
  const c=s=>'"'+String(s).replace(/"/g,'""')+'"';
  const csv=[h.map(c).join(',')].concat(sorted().map(t=>[t.id,t.date,t.kind,t.desc,t.cat,t.party,t.acct,t.status,t.amt].map(c).join(','))).join('\n');
  const a=Object.assign(document.createElement('a'),{href:URL.createObjectURL(new Blob([csv],{type:'text/csv'})),download:'ledgerline-transactions.csv'});
  a.click();URL.revokeObjectURL(a.href);toast('CSV exported');
};
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2200)}

const h=location.hash.slice(1);if(PAGES.some(p=>p[0]===h))page=h;
draw();
})();
</script>
</body>
</html>
